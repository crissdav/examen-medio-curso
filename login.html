<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Software Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold: #eedc9a;
            --sidebar-bg: #222d3d;
            --text: #2b3440;
            --muted: #5f6b7a;
            --border: #e0e0e0;
            --blue: #2f6fed;
            --red: #c0392b;
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(600px 380px at 15% 10%, rgba(238, 220, 154, 0.16), transparent 65%),
                radial-gradient(520px 340px at 85% 90%, rgba(47, 111, 237, 0.18), transparent 60%),
                var(--sidebar-bg);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        :focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 2px;
        }

        .login-card {
            width: min(100%, 400px);
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
        }

        .login-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold);
            color: var(--sidebar-bg);
            font-weight: bold;
            font-size: 18px;
            padding: 8px 16px;
            border-radius: 999px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 24px;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .login-sub {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 22px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap > i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            min-height: 46px;
            padding: 0 44px 0 38px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            color: var(--text);
            background: #fbfcfd;
        }

        .input-wrap input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.18);
            background: #fff;
        }

        .input-wrap input[aria-invalid="true"] {
            border-color: var(--red);
        }

        .toggle-pass {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            background: none;
            border: 0;
            border-radius: 8px;
            color: var(--muted);
            font-size: 14px;
            cursor: pointer;
        }

        .toggle-pass:hover {
            color: var(--text);
            background: var(--border);
        }

        .field-error {
            min-height: 16px;
            margin-top: 5px;
            font-size: 12px;
            color: var(--red);
        }

        .form-alert {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 11px 13px;
            margin-bottom: 16px;
            background: #fbe6e3;
            border: 1px solid #f2c4bd;
            border-radius: var(--radius);
            color: var(--red);
            font-size: 13px;
            font-weight: 600;
        }

        .form-alert[hidden] {
            display: none;
        }

        .form-alert i {
            margin-top: 2px;
        }

        .btn {
            width: 100%;
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--sidebar-bg);
            color: #fff;
            border: 0;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .btn:hover {
            background: #1a2431;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        .login-foot {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .login-foot i {
            color: var(--gold);
            background: var(--sidebar-bg);
            padding: 3px;
            border-radius: 50%;
            font-size: 9px;
        }

        .status-ok {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #1f9d7a;
        }

        .status-ok[hidden] {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.001ms !important;
                animation-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="login-card">
        <span class="login-brand">
            <i class="fa-brands fa-python" aria-hidden="true"></i> Software
        </span>

        <h1>Iniciar sesión</h1>
        <p class="login-sub">Ingresá tus credenciales para acceder al dashboard.</p>

        <form id="login-form" novalidate>
            <p class="form-alert" id="form-alert" role="alert" hidden>
                <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                <span id="form-alert-text"></span>
            </p>

            <div class="field">
                <label for="username">Usuario</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-user" aria-hidden="true"></i>
                    <input type="text" id="username" name="username" autocomplete="username"
                        placeholder="Tu usuario" aria-describedby="username-error" required>
                </div>
                <p class="field-error" id="username-error"></p>
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        placeholder="Tu contraseña" aria-describedby="password-error" required>
                    <button class="toggle-pass" id="toggle-pass" type="button" aria-pressed="false">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                        <span class="sr-only">Mostrar contraseña</span>
                    </button>
                </div>
                <p class="field-error" id="password-error"></p>
            </div>

            <button class="btn" id="btn-submit" type="submit">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                <span id="btn-submit-text">Ingresar</span>
            </button>

            <p class="status-ok" id="status-ok" role="status" aria-live="polite" hidden></p>
        </form>

        <p class="login-foot">
            <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
            Sistema interno · acceso restringido
        </p>
    </main>

    <script>
        (function () {
            var USER = "haniel";
            var PASS = "haniel123";

            if (sessionStorage.getItem("auth") === "ok") {
                location.replace("index.html");
                return;
            }

            var form = document.getElementById("login-form");
            var username = document.getElementById("username");
            var password = document.getElementById("password");
            var usernameError = document.getElementById("username-error");
            var passwordError = document.getElementById("password-error");
            var alertBox = document.getElementById("form-alert");
            var alertText = document.getElementById("form-alert-text");
            var statusOk = document.getElementById("status-ok");
            var submitBtn = document.getElementById("btn-submit");
            var submitText = document.getElementById("btn-submit-text");
            var togglePass = document.getElementById("toggle-pass");

            function setFieldError(field, errorEl, message) {
                errorEl.textContent = message || "";
                if (message) field.setAttribute("aria-invalid", "true");
                else field.removeAttribute("aria-invalid");
            }

            function showAlert(message) {
                alertText.textContent = message;
                alertBox.hidden = false;
            }

            function hideAlert() {
                alertBox.hidden = true;
                alertText.textContent = "";
            }

            togglePass.addEventListener("click", function () {
                var visible = password.type === "text";
                password.type = visible ? "password" : "text";
                togglePass.setAttribute("aria-pressed", String(!visible));
                togglePass.querySelector("i").className = visible
                    ? "fa-regular fa-eye"
                    : "fa-regular fa-eye-slash";
                togglePass.querySelector(".sr-only").textContent =
                    visible ? "Mostrar contraseña" : "Ocultar contraseña";
            });

            [username, password].forEach(function (field) {
                field.addEventListener("input", function () {
                    if (field.getAttribute("aria-invalid") === "true") {
                        setFieldError(
                            field,
                            field === username ? usernameError : passwordError,
                            ""
                        );
                        hideAlert();
                    }
                });
            });

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                hideAlert();
                statusOk.hidden = true;

                var user = username.value.trim();
                var pass = password.value;
                var valid = true;

                if (!user) {
                    setFieldError(username, usernameError, "Ingresá tu usuario.");
                    valid = false;
                } else {
                    setFieldError(username, usernameError, "");
                }

                if (!pass) {
                    setFieldError(password, passwordError, "Ingresá tu contraseña.");
                    valid = false;
                } else {
                    setFieldError(password, passwordError, "");
                }

                if (!valid) {
                    showAlert("Completá los campos marcados para continuar.");
                    (username.getAttribute("aria-invalid") ? username : password).focus();
                    return;
                }

                submitBtn.disabled = true;
                submitText.textContent = "Ingresando…";

                window.setTimeout(function () {
                    if (user === USER && pass === PASS) {
                        sessionStorage.setItem("auth", "ok");
                        statusOk.textContent = "Credenciales correctas. Redirigiendo al dashboard…";
                        statusOk.hidden = false;
                        window.setTimeout(function () {
                            location.replace("index.html");
                        }, 500);
                        return;
                    }

                    submitBtn.disabled = false;
                    submitText.textContent = "Ingresar";
                    showAlert("Usuario o contraseña incorrectos. Intentá de nuevo.");
                    password.value = "";
                    password.focus();
                }, 600);
            });

            username.focus();
        })();
    </script>
</body>

</html>
